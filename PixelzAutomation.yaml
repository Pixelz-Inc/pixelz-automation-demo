  /v1/webhook/public-keys:
    get:
      tags:
        - Webhook
      summary: Retrieve Webhook Public Key
      description: >-
        Retrieve the public key needed to verify the authenticity of webhook
        notifications sent by Pixelz. This ensures that only trusted, secure
        messages are processed by your system, protecting your workflow from
        tampering.


        **Caching Recommendation:**


        The public key is generated once per client and remains static. We
        recommend:

        - **Cache the public key indefinitely** - it will not change for your
        account

        - Fetch the key once during your application initialization or first
        webhook receipt

        - No need to periodically refresh or fetch for every webhook - this
        significantly improves performance and reduces unnecessary API calls
      operationId: GetWebhookPublicKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyData"
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
