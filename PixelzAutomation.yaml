info:
  title: Pixelz Automation API
  description: "\r

    # Pixelz Automation API\r

    # Introduction\r

    The Pixelz Automation API gives you direct access to our in-house AI models
    for image retouching. By calling the API, you can use the same proprietary
    AI technology we've developed in-house for years. Built for fashion
    e-commerce with a deep understanding of products, people, and the details
    that matter in apparel and studio photography. Through simple API requests,
    you can automate tasks such as Remove Background, Create Mask, Create
    Trimap, Model Crop, or Color Matching. Edited images can be returned in
    seconds for quick jobs, or processed in large batches of thousands when
    scale is needed.\r

    \r

    # How It Works\r

    \r

    The Automation API is built with a focus on security, reliability, and
    flexibility. Every request, every image, and every result is handled with
    the same standards we apply in our own production systems.\r

    \r

    ### Authentication and Security\r

    - Access is secured with OAuth 2.0 (Client Credentials flow) using JSON Web
    Tokens. This ensures that only authorized systems can interact with the API,
    with credentials exchanged and validated through an industry-standard
    protocol.\r

    - For additional protection, uploads are handled via presigned URLs with
    strict time limits and automatic file deletion after processing.\r

    \r

    **Request an Access Token:** Exchange your credentials for an access token
    by making a POST request to the token endpoint:\r

    \r

    ```bash\r

    POST
    https://id.pixelz.com/realms/pixelz-automations/protocol/openid-connect/\r

    Content-Type: application/x-www-form-urlencoded\r

    \r

    grant_type=client_credentials\r

    &client_id=YOUR_CLIENT_ID\r

    &client_secret=YOUR_CLIENT_SECRET\r

    &audience=automation.api\r

    ```\r

    \r

    **Receive Token Response:** The token endpoint will return a JSON response
    containing your access token:\r

    \r

    ```json\r

    {\r

    \    \"access_token\":
    \"eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJMY3pMeVVPSFIzN3ZkWVM5N\
    W9nWGhmaG5pUG4xY1RjbXE5OGRza3ZtRFU4In0.eyJleHAiOjE3NjIxOTgxOTAsImlhdCI6MTc2\
    MjE2MjE5MCwianRpIjoidHJydGNjOmE0NTliNTYzLTc3OGMtM2ZmZi04N2YzLTk2MjFkMzJkNmN\
    lMyIsImlzcyI6Imh0dHBzOi8va2V5Y2xvYWsucHh6aHVudGVyLmNvbS9yZWFsbXMvcGl4ZWx6LW\
    F1dG9tYXRpb25zIiwiYXVkIjoiYXV0b21hdGlvbi1hcGkiLCJzdWIiOiI0YWZmMWYwMi02NWVmL\
    TQ2OGEtYjE3Zi03NDAwNGQ3ZTgzYjEiLCJ0eXAiOiJCZWFyZXIiLCJhenAiOiJhdXRvbWF0aW9u\
    LWFwaSIsImFjciI6IjEiLCJhbGxvd2VkLW9yaWdpbnMiOlsiLyoiLCJodHRwczovL2F1dG9tYXR\
    pb24tYXBpLWRldi5weHpodW50ZXIuY29tIl0sInNjb3BlIjoiYXV0b21hdGlvbi1hcGkuYWxsIG\
    F1dG9tYXRpb24tYXBpLmZpbGVzLnVwbG9hZCBlbWFpbCBwcm9maWxlIGFkbWluIiwiY2xpZW50S\
    G9zdCI6IjExOS4xNS4xNjEuMTYyIiwiZW1haWxfdmVyaWZpZWQiOmZhbHNlLCJhcGlfa2V5Ijoi\
    Q0N5dzkwWHJvUTFtbUl0OWlER1hsYWRoN2hHRFNBanRhT2lPWThkWSIsInByZWZlcnJlZF91c2V\
    ybmFtZSI6InNlcnZpY2UtYWNjb3VudC1hdXRvbWF0aW9uLWFwaSIsImNsaWVudEFkZHJlc3MiOi\
    IxMTkuMTUuMTYxLjE2MiIsImNsaWVudF9pZCI6ImF1dG9tYXRpb24tYXBpIn0.V9OfHB_amINcz\
    -ap1dI6sacU4Kan8jU1fBGQZnRrXU1hTWO5NRk_aTpzbH2YgzbVuAESfy5fouA8S1aalYHV3sct\
    5JQ_T2znPqEM3Y-201gBC6enDamcvzF2__Kt31b1DltnDPhzMuw3ZkrMtmjj_FgQz4-NnTlNouI\
    -x54G6wZv3_WBVz5oXVFfxDHIt3KEeLETj47vnqMA4cMtc_8jAXwdK-ZvOYzCDMzcAaTM8N-mCX\
    ZFgOS7w3UZNXqD84dEN1LwTAxh8LbX8_6eIGiHfs_yHneSXxEtWVA1LB84u34iAARXbxlRCBG3y\
    Nj1yi_lyRXz_h9tQmfJ1KJF3N9_CA\",\r

    \    \"expires_in\": 3600,\r

    \    \"refresh_expires_in\": 0,\r

    \    \"token_type\": \"Bearer\",\r

    \    \"not-before-policy\": 0,\r

    \    \"scope\": \"automation-api.all automation-api.files.upload\"\r

    }\r

    ```\r

    \r

    **Use the Token:** Include the access token in the `Authorization` header of
    all API requests:\r

    \r

    ```bash\r

    Authorization: Bearer
    eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMyIsInR5cCI6IkpXVCJ9...\r

    ```\r

    \r

    **Token Lifetime**\r

    \r

    - Access tokens are valid for **1 hour (3600 seconds)** from the time of
    issuance.\r

    - When a token expires, request a new one using the same client
    credentials.\r

    - There is no refresh token in the Client Credentials flow - simply request
    a new access token when needed.\r

    \r

    **Scopes**\r

    \r

    The API uses scopes to control access to different features:\r

    - `automation.api` - Access to image processing endpoints (Model Crop, Mask,
    Trimap, Color Matching, Remove Background)\r

    - `file.api` - Access to file upload functionality (must be explicitly
    enabled for your account)\r

    Request only the scopes you need for your application.\r

    \r

    ## Documentation\r

    The API is fully described with the OpenAPI specification and delivered
    through Scalar UI. Endpoints, parameters, and response structures are
    defined so you can integrate them into any technical environment.\r

    \r

    ## File input\r

    - Images can be provided in two ways:\r

    \    * As a public URL (if already hosted online).\r

    \    * As a secure direct upload via presigned URLs.\r

    - Supported formats include JPG, PNG, and WEBP, with automatic cleanup of
    uploaded files to protect data privacy.\r

    \r

    ## File Storage Policy\r

    \r

    Understanding how long files are stored helps you plan your workflow and
    download timing:\r

    \r

    **Uploaded Files (Source Images):**\r

    - Files uploaded via presigned URLs are stored temporarily for **24
    hours**\r

    - Automatic deletion after processing ensures data privacy and security\r

    - No manual cleanup required on your part\r

    \r

    **Result Files (Processed Images):**\r

    - Result URLs remain valid for **7 days** from job completion\r

    - This applies to both synchronous and asynchronous processing modes\r

    - Download your results within this timeframe to ensure access\r

    - After expiration, files are automatically deleted and URLs become
    invalid\r

    \r

    **Presigned Upload URLs:**\r

    - Upload URLs expire after **24 hours** from generation\r

    - Complete your file upload within this timeframe\r

    - Request a new URL if the original expires before upload\r

    \r

    **Best Practices:**\r

    - Download and store result files in your own storage system promptly\r

    - Don't rely on Pixelz URLs as permanent storage\r

    - Implement automatic download workflows for asynchronous jobs\r

    \r

    ## Processing Modes\r

    \r

    The API supports both synchronous and asynchronous processing modes to
    accommodate different use cases and workloads:\r

    \r

    ### Synchronous Mode\r

    - Results are returned immediately in the same HTTP response\r

    - Best for lightweight operations or when you need instant results\r

    - Returns HTTP 200 status with the processed result\r

    - No webhook or job tracking required\r

    \r

    ### Asynchronous Mode\r

    - For larger image or when you prefer non-blocking operations\r

    - Returns HTTP 201 status with a `job_id` for tracking\r

    - Results can be retrieved via the `/images/jobs/{jobId}/status` endpoint\r

    - Optionally, results can be delivered via webhook callback if you provide a
    `callback_url`\r

    - Webhooks are cryptographically signed using ECDSA with SHA256 to guarantee
    authenticity\r

    \r

    **How to Use Asynchronous Mode:**\r

    1. Add the header `Respond-Mode: async` to your API request\r

    2. Optionally include a `callback_url` parameter if you want webhook
    notifications\r

    3. Receive a `job_id` in the immediate response (HTTP 201)\r

    4. Poll the `/images/jobs/{jobId}/status` endpoint to check job progress and
    retrieve results\r

    5. If you provided a `callback_url`, your callback endpoint will receive a
    POST request with the results when processing completes\r

    6. Verify the webhook signature using the public key from the `/public-keys`
    endpoint\r

    \r

    **Webhook Payload Structure:**\r

    \r

    When your job completes, a POST request will be sent to your `callback_url`
    with the following JSON payload:\r

    \r

    ```json\r

    {\r

    \  \"JobId\": \"12345678-1234-1234-1234-123456789012\",\r

    \  \"Status\": \"completed\",\r

    \  \"EventType\": \"job.completed\",\r

    \  \"Timestamp\": \"2025-01-31T12:00:00.0000000Z\",\r

    \  \"WebhookVersion\": \"1.0\",\r

    \  \"ResultData\": {\r

    \    \"ResultImageUrl\": \"https://example.com/result-image.png\",\r

    \    \"ResultTrimapVectorUrl\":
    \"https://example.com/trimap-vector.json\",\r

    \    \"ErrorCode\": null,\r

    \    \"ErrorMessage\": null\r

    \  }\r

    }\r

    ```\r

    \r

    **Webhook Headers:**\r

    - `Content-Type: application/json`\r

    - `X-Signature`: ECDSA signature of the payload (Base64-encoded)\r

    \r

    **Webhook Signature Verification:**\r

    - Each webhook includes an `X-Signature` header containing an ECDSA
    signature\r

    - The signature is generated using SHA256 hash of the JSON payload\r

    - Retrieve the public key from the `/public-keys` endpoint to verify
    authenticity\r

    - Algorithm: ECDSA with P-256 curve, Base64-encoded signature\r

    - This ensures webhooks are genuine and haven't been tampered.\r

    \r

    **Example Signature Verification (Python):**\r

    ```python\r

    import base64\r

    import json\r

    from cryptography.hazmat.primitives import hashes, serialization\r

    from cryptography.hazmat.primitives.asymmetric import ec\r

    \r

    # Get the public key from /public-keys endpoint\r

    public_key_b64 = \"<public_key_from_api>\"\r

    public_key_bytes = base64.b64decode(public_key_b64)\r

    public_key = serialization.load_der_public_key(public_key_bytes)\r

    \r

    # Get signature from X-Signature header\r

    signature_b64 = request.headers.get('X-Signature')\r

    signature = base64.b64decode(signature_b64)\r

    \r

    # Get the webhook payload\r

    payload = request.body  # Raw JSON string\r

    \r

    # Verify the signature\r

    try:\r

    \    public_key.verify(\r

    \        signature,\r

    \        payload.encode('utf-8'),\r

    \        ec.ECDSA(hashes.SHA256())\r

    \    )\r

    \    print(\"Webhook signature verified successfully\")\r

    except Exception as e:\r

    \    print(\"Webhook signature verification failed\")\r

    ```\r

    \r

    **Webhook Retry Mechanism:**\r

    - If your callback endpoint is unreachable or returns an error, the webhook
    will be retried automatically\r

    - Each retry time is calculated after the previous attempt fails, following
    an exponential backoff strategy:\r

    \  - Retry 1: 10 minutes after initial failure\r

    \  - Retry 2: 30 minutes after retry 1 fails\r

    \  - Retry 3: 90 minutes after retry 2 fails\r

    \  - Retry 4: 270 minutes after retry 3 fails\r

    \  - Retry 5: 1040 minutes after retry 4 fails (24 hours after job
    finished)\r

    - After 5 failed attempts, the webhook will be marked as expired and no
    further retries will be attempted\r

    - Ensure your webhook endpoint returns a 2xx status code to confirm
    receipt\r

    \r

    **Job Status Endpoint:**\r

    \r

    For asynchronous jobs, you can check the current status and retrieve results
    using the job status endpoint:\r

    \r

    ```\r

    GET /v1/images/jobs/{jobId}/status\r

    Authorization: Bearer <your_access_token>\r

    ```\r

    \r

    **Response Structure:**\r

    ```json\r

    {{\r

    \  \"job_type\": \"RemoveBackground\",\r

    \  \"status\": {{\r

    \    \"status_code\": 200,\r

    \    \"status_name\": \"Completed\"\r

    \  }},\r

    \  \"result\": {{\r

    \    \"result_image_url\": \"https://example.com/result-image.png\",\r

    \    \"result_trimap_vector_url\": null\r

    \  }}\r

    }}\r

    ```\r

    \r

    **Common Status Codes:**\r

    - `100` - Processing: Job is currently being processed\r

    - `200` - Completed: Job completed successfully, result is available\r

    - `500` - Failed: Job processing failed\r

    \r

    **When to Use:**\r

    - Poll this endpoint to track job progress if you prefer not to rely solely
    on webhooks\r

    - Retrieve results if the webhook delivery failed\r

    - Check job status before the webhook is received\r

    - Free to use (no tokens consumed)\r

    \r

    ## Scalability\r

    The infrastructure supports workloads ranging from single requests to tens
    of thousands of images. Rate limiting and job management are in place to
    ensure consistent performance, even under heavy load.\r

    \r

    ## Pricing\r

    A token-based system provides transparent and predictable usage. Each method
    specifies its cost in tokens.\r

    \r

    # Getting Started\r

    \r

    To begin using the API, you'll need the credentials and tokens. These are
    provided as part of your account setup, and once you have them you can
    authenticate and start making requests.\r

    \r

    ## Synchronous Mode (Immediate Results)\r

    1.  **Authenticate:** Use your credentials to request an access token with
    OAuth 2.0. This token is required to authorize your API calls.\r

    2.  **Send an image:** Provide a public URL for the image or upload securely
    using a presigned link. Supported formats are JPG, JPEG, PNG, and WEBP.\r

    3.  **Call a method:** Choose an operation such as Remove Background, Create
    Mask, Create Trimap, Model Crop, or Color Matching, and submit your request
    without a `callback_url`.\r

    4.  **Receive results:** The processed image URL is returned immediately in
    the response (HTTP 200).\r

    \r

    ## Asynchronous Mode (Non-blocking Processing)\r

    1.  **Authenticate:** Use your credentials to request an access token with
    OAuth 2.0.\r

    2.  **Send an image:** Provide a public URL for the image or upload securely
    using a presigned link.\r

    3.  **Call a method:** Add the header `Respond-Mode: async` to enable async
    mode. Optionally include a `callback_url` parameter if you want webhook
    notifications.\r

    4.  **Receive job ID:** You'll immediately receive a `job_id` in the
    response (HTTP 201).\r

    5.  **Track progress:** Use the `GET /v1/images/jobs/{jobId}/status`
    endpoint to check job status and retrieve results.\r

    6.  **Setup webhook endpoint (optional):** If you provided a `callback_url`,
    ensure your endpoint is ready to receive POST requests.\r

    7.  **Verify webhook (optional):** If using webhooks, verify the
    `X-Signature` header using the public key from `/public-keys`.\r

    8.  **Process results:** Extract the result image URL from the webhook
    payload's `ResultData` object or from the status endpoint.\r

    \r

    \            "
  contact:
    name: Pixelz Support
    email: cs@pixelz.com
  license:
    name: Pixelz Terms of Service
    url: https://www.pixelz.com/terms/
  version: v1
servers:
  - url: https://automation-api.pixelz.com
paths:
  /v1/images/color-matching:
    post:
      tags:
        - Image processing
      summary: Color Matching
      description: |-
        Adjusts product or garment colors to match a reference.

        **Rate Limit:** 30 requests per minute.

        **Cost:** 100 tokens per request.
      operationId: ColorMatchingJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorMatchingCommand"
            examples:
              WithSwatchImage:
                summary: Color matching with swatch image
                description: Use this example when you want to match colors against a reference
                  image. The swatch_color_code must be null.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image:
                        swatch_image_url: https://example.com/swatch-image.jpg
                        x_coordinate: 12
                        y_coordinate: 34
                      swatch_color_code: null
              WithColorCode:
                summary: Color matching with hex color code
                description: Use this example when you want to match colors against a specific
                  hex color code. The swatch_image must be null.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image: null
                      swatch_color_code: "#FF5733"
              WithMultipleMarkers:
                summary: Color matching with multiple markers
                description: Use this example when you want to match multiple colors in a single
                  image. You can mix swatch images and color codes across
                  different markers.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image:
                        swatch_image_url: https://example.com/swatch-1.jpg
                        x_coordinate: 15
                        y_coordinate: 15
                      swatch_color_code: null
                    - x_coordinate: 200
                      y_coordinate: 150
                      swatch_image: null
                      swatch_color_code: "#00FF00"
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image: null
                      swatch_color_code: "#FF5733"
                  callback_url: https://your-domain.com/webhook/color-matching
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorMatchingResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: BadRequestError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 400
                  title:
                    type: string
                    description: >-
                      Error code indicating the type of issue encountered.


                      Possible error codes:

                      - `default_error`: An error occurred while processing your
                      request. Please try again later.

                      - `unknown_error`: Unknown error has occurred in our
                      processing. The issue has been logged and will be looked
                      at.

                      - `unknown_backend_issue`: Unknown backend issue.

                      - `invalid_file_url`: Invalid File URL format.

                      - `presigned_file_move_failed`: Failed to move presigned
                      file to workspace.

                      - `file_type_not_supported`: File type not supported.

                      - `download_failed`: Failed to download the file from
                      provided URL.

                      - `insufficient_balance`: Insufficient balance

                      - `service_not_found`: No matching service found

                      - `balance_not_found`: Balance not found for client

                      - `no_token_consumption`: No token consumption found

                      - `transaction_already_reverted`: Transaction already
                      reverted

                      - `invalid_file_name`: File name must include a valid
                      extension

                      - `presigned_url_creation_failed`: Can't create presigned
                      url

                      - `invalid_request`: Invalid request parameters
                    example: BadRequestError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Bad Request
                description: Bad Request
                example:
                  status: 400
                  title: BadRequestError
                  detail: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/images/create-mask:
    post:
      tags:
        - Image processing
      summary: Create Mask
      description: |-
        Generates a grayscale subject mask.

        **Rate Limit:** 60 requests per minute.

        **Cost:** 100 tokens per request.
      operationId: CreateMaskJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaskCommand"
            examples:
              BasicMask:
                summary: Basic mask creation
                description: Use this example to create a grayscale mask with default settings.
                  The feather width will be automatically determined by the AI.
                value:
                  image_url: https://example.com/product-image.jpg
              WithCustomFeather:
                summary: Mask with custom feather width
                description: Use this example to specify a custom feather width for the mask
                  edges. Lower values create sharper edges, higher values create
                  softer edges.
                value:
                  image_url: https://example.com/product-image.jpg
                  feather_width: 3
              WithCustomTrimap:
                summary: Mask with custom trimap
                description: Use this example when you have a custom trimap to control which
                  parts of the image should be masked.
                value:
                  image_url: https://example.com/product-image.jpg
                  trimap_url: https://example.com/custom-trimap.png
                  feather_width: 3
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  feather_width: 3
                  callback_url: https://your-domain.com/webhook/create-mask
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMaskResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: BadRequestError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 400
                  title:
                    type: string
                    description: >-
                      Error code indicating the type of issue encountered.


                      Possible error codes:

                      - `default_error`: An error occurred while processing your
                      request. Please try again later.

                      - `unknown_error`: Unknown error has occurred in our
                      processing. The issue has been logged and will be looked
                      at.

                      - `unknown_backend_issue`: Unknown backend issue.

                      - `invalid_file_url`: Invalid File URL format.

                      - `presigned_file_move_failed`: Failed to move presigned
                      file to workspace.

                      - `file_type_not_supported`: File type not supported.

                      - `download_failed`: Failed to download the file from
                      provided URL.

                      - `insufficient_balance`: Insufficient balance

                      - `service_not_found`: No matching service found

                      - `balance_not_found`: Balance not found for client

                      - `no_token_consumption`: No token consumption found

                      - `transaction_already_reverted`: Transaction already
                      reverted

                      - `invalid_file_name`: File name must include a valid
                      extension

                      - `presigned_url_creation_failed`: Can't create presigned
                      url

                      - `invalid_request`: Invalid request parameters
                    example: BadRequestError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Bad Request
                description: Bad Request
                example:
                  status: 400
                  title: BadRequestError
                  detail: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
