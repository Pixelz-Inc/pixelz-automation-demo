info:
  title: Pixelz Automation API
  description: "

    # Pixelz Automation API

    # Introduction

    The Pixelz Automation API gives you direct access to our in-house AI models
    for image retouching. By calling the API, you can use the same proprietary
    AI technology we've developed in-house for years. Built for fashion
    e-commerce with a deep understanding of products, people, and the details
    that matter in apparel and studio photography. Through simple API requests,
    you can automate tasks such as Remove Background, Create Mask, Create
    Trimap, Model Crop, or Color Matching. Edited images can be returned in
    seconds for quick jobs, or processed in large batches of thousands when
    scale is needed.


    # How It Works


    The Automation API is built with a focus on security, reliability, and
    flexibility. Every request, every image, and every result is handled with
    the same standards we apply in our own production systems.


    ### Authentication and Security

    - Access is secured with OAuth 2.0 (Client Credentials flow) using JSON Web
    Tokens. This ensures that only authorized systems can interact with the API,
    with credentials exchanged and validated through an industry-standard
    protocol.

    - The identity server is powered by **Keycloak**, an open-source identity
    and access management solution that handles authentication, token issuance,
    and client credential verification.

    - For additional protection, uploads are handled via presigned URLs with
    strict time limits and automatic file deletion after processing.


    **Request an Access Token:** Exchange your credentials for an access token
    by making a POST request to the token endpoint:


    ```bash

    POST
    https://id.pixelz.com/realms/pixelz-automations/protocol/openid-connect/tok\
    en

    Content-Type: application/x-www-form-urlencoded


    grant_type=client_credentials

    &client_id=YOUR_CLIENT_ID

    &client_secret=YOUR_CLIENT_SECRET

    ```


    **Receive Token Response:** The token endpoint will return a JSON response
    containing your access token:


    ```json

    {

    \    \"access_token\":
    \"eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJMY3pMeVVPSFIzN3ZkWVM5N\
    W9nWGhmaG5pUG4xY1RjbXE5OGRza3ZtRFU4In0.eyJleHAiOjE3NjIxOTgxOTAsImlhdCI6MTc2\
    MjE2MjE5MCwianRpIjoidHJydGNjOmE0NTliNTYzLTc3OGMtM2ZmZi04N2YzLTk2MjFkMzJkNmN\
    lMyIsImlzcyI6Imh0dHBzOi8va2V5Y2xvYWsucHh6aHVudGVyLmNvbS9yZWFsbXMvcGl4ZWx6LW\
    F1dG9tYXRpb25zIiwiYXVkIjoiYXV0b21hdGlvbi1hcGkiLCJzdWIiOiI0YWZmMWYwMi02NWVmL\
    TQ2OGEtYjE3Zi03NDAwNGQ3ZTgzYjEiLCJ0eXAiOiJCZWFyZXIiLCJhenAiOiJhdXRvbWF0aW9u\
    LWFwaSIsImFjciI6IjEiLCJhbGxvd2VkLW9yaWdpbnMiOlsiLyoiLCJodHRwczovL2F1dG9tYXR\
    pb24tYXBpLWRldi5weHpodW50ZXIuY29tIl0sInNjb3BlIjoiYXV0b21hdGlvbi1hcGkuYWxsIG\
    F1dG9tYXRpb24tYXBpLmZpbGVzLnVwbG9hZCBlbWFpbCBwcm9maWxlIGFkbWluIiwiY2xpZW50S\
    G9zdCI6IjExOS4xNS4xNjEuMTYyIiwiZW1haWxfdmVyaWZpZWQiOmZhbHNlLCJhcGlfa2V5Ijoi\
    Q0N5dzkwWHJvUTFtbUl0OWlER1hsYWRoN2hHRFNBanRhT2lPWThkWSIsInByZWZlcnJlZF91c2V\
    ybmFtZSI6InNlcnZpY2UtYWNjb3VudC1hdXRvbWF0aW9uLWFwaSIsImNsaWVudEFkZHJlc3MiOi\
    IxMTkuMTUuMTYxLjE2MiIsImNsaWVudF9pZCI6ImF1dG9tYXRpb24tYXBpIn0.V9OfHB_amINcz\
    -ap1dI6sacU4Kan8jU1fBGQZnRrXU1hTWO5NRk_aTpzbH2YgzbVuAESfy5fouA8S1aalYHV3sct\
    5JQ_T2znPqEM3Y-201gBC6enDamcvzF2__Kt31b1DltnDPhzMuw3ZkrMtmjj_FgQz4-NnTlNouI\
    -x54G6wZv3_WBVz5oXVFfxDHIt3KEeLETj47vnqMA4cMtc_8jAXwdK-ZvOYzCDMzcAaTM8N-mCX\
    ZFgOS7w3UZNXqD84dEN1LwTAxh8LbX8_6eIGiHfs_yHneSXxEtWVA1LB84u34iAARXbxlRCBG3y\
    Nj1yi_lyRXz_h9tQmfJ1KJF3N9_CA\",

    \    \"expires_in\": 3600,

    \    \"refresh_expires_in\": 0,

    \    \"token_type\": \"Bearer\",

    \    \"not-before-policy\": 0,

    \    \"scope\": \"automation-api.images.all automation-api.files.upload\"

    }

    ```


    **Use the Token:** Include the access token in the `Authorization` header of
    all API requests:


    ```bash

    Authorization: Bearer
    eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMyIsInR5cCI6IkpXVCJ9...

    ```


    **Token Lifetime**


    - Access tokens are valid for **1 hour (3600 seconds)** from the time of
    issuance.

    - When a token expires, request a new one using the same client credentials.

    - There is no refresh token in the Client Credentials flow - simply request
    a new access token when needed.


    **Scopes**


    The API uses scopes to control access to different features:

    - `automation-api.images.all` - Access to image processing endpoints (Model
    Crop, Mask, Trimap, Color Matching, Remove Background)

    - `automation-api.files.upload` - Access to file upload functionality (must
    be explicitly enabled for your account)

    Request only the scopes you need for your application.


    ## Documentation

    The API is fully described with the OpenAPI specification and delivered
    through Scalar UI. Endpoints, parameters, and response structures are
    defined so you can integrate them into any technical environment.


    ## File input

    - Images can be provided in two ways:

    \    * As a public URL (if already hosted online).

    \    * As a secure direct upload via presigned URLs.

    - Supported formats include JPG, PNG, and WEBP, with automatic cleanup of
    uploaded files to protect data privacy.


    ## Output File Naming


    The API automatically renames result files to help you identify the
    processing operation that was applied. Each output file uses the original
    filename with a descriptive suffix appended:


    **Naming Pattern:** `{original_filename}_{operation_suffix}.{extension}`


    **Operation Suffixes:**

    - **Model Crop:** `cropped` (e.g., `product.jpg` → `product_cropped.jpg`)

    - **Color Matching:** `color_matched` (e.g., `product.jpg` →
    `product_color_matched.jpg`)

    - **Remove Background:** `bg_removed` (e.g., `product.jpg` →
    `product_bg_removed.png`)

    - **Create Mask:** `masked` (e.g., `product.jpg` → `product_masked.png`)

    - **Create Trimap:** `trimaprgb` for the image, `trimap.json` for the vector
    data (e.g., `product.jpg` → `product_trimaprgb.png` and
    `product_trimap.json`)


    The file extension is determined by the output format of the processing
    operation (typically PNG for operations involving transparency).


    ## File Storage Policy


    Understanding how long files are stored helps you plan your workflow and
    download timing:


    **Uploaded Files (Source Images):**

    - Files uploaded via presigned URLs are stored temporarily for **24 hours**

    - Automatic deletion after processing ensures data privacy and security

    - No manual cleanup required on your part


    **Result Files (Processed Images):**

    - Result URLs remain valid for **7 days** from job completion

    - This applies to both synchronous and asynchronous processing modes

    - Download your results within this timeframe to ensure access

    - After expiration, files are automatically deleted and URLs become invalid


    **Presigned Upload URLs:**

    - Upload URLs expire after **24 hours** from generation

    - Complete your file upload within this timeframe

    - Request a new URL if the original expires before upload


    **Best Practices:**

    - Download and store result files in your own storage system promptly

    - Don't rely on Pixelz URLs as permanent storage

    - Implement automatic download workflows for asynchronous jobs


    ## Processing Modes


    The API supports both synchronous and asynchronous processing modes to
    accommodate different use cases and workloads:


    ### Synchronous Mode

    - Results are returned immediately in the same HTTP response

    - Best for lightweight operations or when you need instant results

    - Returns HTTP 200 status with the processed result

    - No webhook or job tracking required


    ### Asynchronous Mode

    - For larger image or when you prefer non-blocking operations

    - Returns HTTP 201 status with a `job_id` for tracking

    - Results can be retrieved via the `/images/jobs/{jobId}/status` endpoint

    - Optionally, results can be delivered via webhook callback if you provide a
    `callback_url`

    - Webhooks are cryptographically signed using ECDSA with SHA256 to guarantee
    authenticity


    **How to Use Asynchronous Mode:**

    1. Add the header `Respond-Mode: async` to your API request

    2. Optionally include a `callback_url` parameter if you want webhook
    notifications

    3. Receive a `job_id` in the immediate response (HTTP 201)

    4. Check the `Retry-After` header in the response, which indicates the
    recommended delay (in seconds) before checking job status

    5. Poll the `/images/jobs/{jobId}/status` endpoint to check job progress and
    retrieve results

    6. If you provided a `callback_url`, your callback endpoint will receive a
    POST request with the results when processing completes

    7. Verify the webhook signature using the public key from the `/public-keys`
    endpoint


    **Retry-After Header:**

    - When you submit a job in asynchronous mode, the API returns a
    `Retry-After` header with a value in seconds (default: 30)

    - This header indicates the recommended minimum delay before your first
    status check

    - Respecting this header helps optimize server load and prevents unnecessary
    polling

    - Example: `Retry-After: 30` means you should wait at least 30 seconds
    before checking the job status


    **Webhook Payload Structure:**


    When your job completes, a POST request will be sent to your `callback_url`
    with the following JSON payload:


    ```json

    {

    \  \"JobId\": \"12345678-1234-1234-1234-123456789012\",

    \  \"Status\": \"completed\",

    \  \"EventType\": \"job.completed\",

    \  \"Timestamp\": \"2025-01-31T12:00:00.0000000Z\",

    \  \"WebhookVersion\": \"1.0\",

    \  \"ResultData\": {

    \    \"ResultImageUrl\": \"https://example.com/product_bg_removed.png\",

    \    \"ResultTrimapVectorUrl\": null,

    \    \"ErrorCode\": null,

    \    \"ErrorMessage\": null

    \  }

    }

    ```


    **Webhook Headers:**

    - `Content-Type: application/json`

    - `X-Signature`: ECDSA signature of the payload (Base64-encoded)


    **Webhook Signature Verification:**

    - Each webhook includes an `X-Signature` header containing an ECDSA
    signature

    - The signature is generated using SHA256 hash of the JSON payload

    - Retrieve the public key from the `/public-keys` endpoint to verify
    authenticity

    - Algorithm: ECDSA with P-256 curve, Base64-encoded signature

    - This ensures webhooks are genuine and haven't been tampered.


    **Example Signature Verification (Python):**

    ```python

    import base64

    import json

    from cryptography.hazmat.primitives import hashes, serialization

    from cryptography.hazmat.primitives.asymmetric import ec


    # Get the public key from /public-keys endpoint

    public_key_b64 = \"<public_key_from_api>\"

    public_key_bytes = base64.b64decode(public_key_b64)

    public_key = serialization.load_der_public_key(public_key_bytes)


    # Get signature from X-Signature header

    signature_b64 = request.headers.get('X-Signature')

    signature = base64.b64decode(signature_b64)


    # Get the webhook payload

    payload = request.body  # Raw JSON string


    # Verify the signature

    try:

    \    public_key.verify(

    \        signature,

    \        payload.encode('utf-8'),

    \        ec.ECDSA(hashes.SHA256())

    \    )

    \    print(\"Webhook signature verified successfully\")

    except Exception as e:

    \    print(\"Webhook signature verification failed\")

    ```


    **Webhook Retry Mechanism:**

    - If your callback endpoint is unreachable or returns an error, the webhook
    will be retried automatically

    - Each retry time is calculated after the previous attempt fails, following
    an exponential backoff strategy:

    \  - Retry 1: 10 minutes after initial failure

    \  - Retry 2: 30 minutes after retry 1 fails

    \  - Retry 3: 90 minutes after retry 2 fails

    \  - Retry 4: 270 minutes after retry 3 fails

    \  - Retry 5: 1040 minutes after retry 4 fails (24 hours after job finished)

    - After 5 failed attempts, the webhook will be marked as expired and no
    further retries will be attempted

    - Ensure your webhook endpoint returns a 2xx status code to confirm receipt


    **Job Status Endpoint:**


    For asynchronous jobs, you can check the current status and retrieve results
    using the job status endpoint:


    ```

    GET /v1/images/jobs/{jobId}/status

    Authorization: Bearer <your_access_token>

    ```


    **Response Structure:**

    ```json

    {

    \  \"job_type\": \"RemoveBackground\",

    \  \"status\": {

    \    \"status_code\": 4,

    \    \"status_name\": \"Completed\"

    \  },

    \  \"result\": {

    \    \"result_image_url\": \"https://example.com/product_bg_removed.png\",

    \    \"result_trimap_vector_url\": null

    \  }

    }

    ```


    **Common Status Codes:**

    - `3` - Processing: Job is currently being processed

    - `4` - Completed: Job completed successfully, result is available

    - `6` - Failed: Job processing failed


    **When to Use:**

    - Poll this endpoint to track job progress if you prefer not to rely solely
    on webhooks

    - Retrieve results if the webhook delivery failed

    - Check job status before the webhook is received

    - Free to use (no tokens consumed)


    ## Scalability

    The infrastructure supports workloads ranging from single requests to tens
    of thousands of images. Rate limiting and job management are in place to
    ensure consistent performance, even under heavy load.


    ## Pricing

    A token-based system provides transparent and predictable usage. Each method
    specifies its cost in tokens.


    # Getting Started


    To begin using the API, you'll need the credentials and tokens. These are
    provided as part of your account setup, and once you have them you can
    authenticate and start making requests.


    ## Synchronous Mode (Immediate Results)

    1.  **Authenticate:** Use your credentials to request an access token with
    OAuth 2.0. This token is required to authorize your API calls.

    2.  **Send an image:** Provide a public URL for the image or upload securely
    using a presigned link. Supported formats are JPG, JPEG, PNG, and WEBP.

    3.  **Call a method:** Choose an operation such as Remove Background, Create
    Mask, Create Trimap, Model Crop, or Color Matching, and submit your request
    without a `callback_url`.

    4.  **Receive results:** The processed image URL is returned immediately in
    the response (HTTP 200).


    ## Asynchronous Mode (Non-blocking Processing)

    1.  **Authenticate:** Use your credentials to request an access token with
    OAuth 2.0.

    2.  **Send an image:** Provide a public URL for the image or upload securely
    using a presigned link.

    3.  **Call a method:** Add the header `Respond-Mode: async` to enable async
    mode. Optionally include a `callback_url` parameter if you want webhook
    notifications.

    4.  **Receive job ID:** You'll immediately receive a `job_id` in the
    response (HTTP 201) along with a `Retry-After` header indicating when to
    check status.

    5.  **Track progress:** Wait for the time specified in the `Retry-After`
    header (typically 30 seconds), then use the `GET
    /v1/images/jobs/{jobId}/status` endpoint to check job status and retrieve
    results.

    6.  **Setup webhook endpoint (optional):** If you provided a `callback_url`,
    ensure your endpoint is ready to receive POST requests.

    7.  **Verify webhook (optional):** If using webhooks, verify the
    `X-Signature` header using the public key from `/public-keys`.

    8.  **Process results:** Extract the result image URL from the webhook
    payload's `ResultData` object or from the status endpoint.


    \            "
  contact:
    name: Pixelz Support
    email: cs@pixelz.com
  license:
    name: Pixelz Terms of Service
    url: https://www.pixelz.com/terms/
  version: v1
servers:
  - url: https://automation-api.pixelz.com
paths:
  /v1/images/color-matching:
    post:
      tags:
        - Image processing
      summary: Color Matching
      description: |-
        Adjusts product or garment colors to match a reference.

        **Rate Limit:** 30 requests per minute.

        **Cost:** 100 tokens per request.
      operationId: ColorMatchingJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorMatchingCommand"
            examples:
              WithSwatchImage:
                summary: Color matching with swatch image
                description: Use this example when you want to match colors against a reference
                  image. The swatch_color_code must be null.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image:
                        swatch_image_url: https://example.com/swatch-image.jpg
                        x_coordinate: 12
                        y_coordinate: 34
                      swatch_color_code: null
              WithColorCode:
                summary: Color matching with hex color code
                description: Use this example when you want to match colors against a specific
                  hex color code. The swatch_image must be null.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image: null
                      swatch_color_code: "#FF5733"
              WithMultipleMarkers:
                summary: Color matching with multiple markers
                description: Use this example when you want to match multiple colors in a single
                  image. You can mix swatch images and color codes across
                  different markers.
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image:
                        swatch_image_url: https://example.com/swatch-1.jpg
                        x_coordinate: 15
                        y_coordinate: 15
                      swatch_color_code: null
                    - x_coordinate: 200
                      y_coordinate: 150
                      swatch_image: null
                      swatch_color_code: "#00FF00"
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  color_markers:
                    - x_coordinate: 100
                      y_coordinate: 100
                      swatch_image: null
                      swatch_color_code: "#FF5733"
                  callback_url: https://your-domain.com/webhook/color-matching
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorMatchingResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/images/create-mask:
    post:
      tags:
        - Image processing
      summary: Create Mask
      description: |-
        Generates a grayscale subject mask.

        **Rate Limit:** 60 requests per minute.

        **Cost:** 100 tokens per request.
      operationId: CreateMaskJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaskCommand"
            examples:
              BasicMask:
                summary: Basic mask creation
                description: Use this example to create a grayscale mask with default settings.
                  The feather width will be automatically determined by the AI.
                value:
                  image_url: https://example.com/product-image.jpg
              WithCustomFeather:
                summary: Mask with custom feather width
                description: Use this example to specify a custom feather width for the mask
                  edges. Lower values create sharper edges, higher values create
                  softer edges.
                value:
                  image_url: https://example.com/product-image.jpg
                  feather_width: 2
              WithCustomTrimap:
                summary: Mask with custom trimap
                description: Use this example when you have a custom trimap to control which
                  parts of the image should be masked.
                value:
                  image_url: https://example.com/product-image.jpg
                  trimap_url: https://example.com/custom-trimap.png
                  feather_width: 1.5
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  feather_width: 1.5
                  callback_url: https://your-domain.com/webhook/create-mask
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMaskResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/images/create-trimap:
    post:
      tags:
        - Image processing
      summary: Create Trimap
      description: >-
        Creates a trimap with three regions: foreground, background, and a
        boundary zone around subject edges.


        **Rate Limit:** 60 requests per minute.


        **Cost:** 50 tokens per request.
      operationId: CreateTrimapJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrimapCommand"
            examples:
              BasicTrimap:
                summary: Basic trimap creation
                description: "Use this example to create a trimap with automatic
                  foreground/background detection. The trimap will identify
                  three regions: definite foreground (white), definite
                  background (black), and uncertain boundary zone (gray)."
                value:
                  image_url: https://example.com/product-image.jpg
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  callback_url: https://your-domain.com/webhook/create-trimap
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTrimapResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/files/request-upload-url:
    post:
      tags:
        - File
      summary: Prepare to upload an image or asset
      description: |-
        Prepare to upload an image or asset securely using a pre-signed URL. This endpoint enables you to transfer files directly to Pixelz without exposing sensitive credentials, making uploads fast, secure, and easy to integrate into your workflow.

        **Supported File Types:** JPG, JPEG, PNG, WEBP

        **Storage Duration:** 24 hours 

        **Note:** This endpoint only operates in synchronous mode and returns the pre-signed URL immediately.

        **Important:** This feature is disabled by default. Please contact us to enable file upload functionality for your account.

        Once you have gotten the presigned S3 URLs, you upload your images to the URLs following Amazon's documentation, and you then use the returned URL as the image_url input for the rest of the API. For detailed instructions on how to upload a file to a presigned URL, please refer to the [AWS documentation on uploading objects using presigned URLs](https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html).
      operationId: UploadFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareUploadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestFileUploadResult"
        "400":
          description: BadRequestError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 400
                  title:
                    type: string
                    description: >-
                      Error code indicating the type of issue encountered.


                      Possible error codes:

                      - `default_error`: An error occurred while processing your
                      request. Please try again later.

                      - `unknown_error`: Unknown error has occurred in our
                      processing. The issue has been logged and will be looked
                      at.

                      - `unknown_backend_issue`: Unknown backend issue.

                      - `file_type_not_supported`: File type not supported.

                      - `invalid_file_name`: File name must include a valid
                      extension

                      - `presigned_url_creation_failed`: Can't create presigned
                      url

                      - `invalid_request`: Invalid request parameters
                    example: BadRequestError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Bad Request
                description: Bad Request
                example:
                  status: 400
                  title: BadRequestError
                  detail: Bad Request
        "401":
