components:
  schemas:
    ColorMarker:
      type: object
      properties:
        x_coordinate:
          type: integer
          description: The x-coordinate specifies the horizontal position of the center of
            a 30x30px block in the main file which is representative of the
            color to color match (avoid shadows and highlights).
          format: int32
          example: 100
        y_coordinate:
          type: integer
          description: The y-coordinate specifies the vertical position of the center of a
            30x30px block in the main file which is representative of the color
            to color match (avoid shadows and highlights).
          format: int32
          example: 100
        swatch_image:
          $ref: "#/components/schemas/SwatchImage"
        swatch_color_code:
          type: string
          description: The hex format color code (e.g., '#FF5733') to be used for color
            matching. When swatch_color_code is set swatch_image must be null.
          nullable: true
          example: "#FF5733"
      description: Represents a color marker used in the color matching process.
        Provide either a swatch_color_code or a swatch_image, but not both. Each
        marker can reference a color either through a swatch image or a direct
        color code.
    ColorMatchingCommand:
      required:
        - color_markers
        - image_url
      type: object
      properties:
        color_markers:
          type: array
          items:
            $ref: "#/components/schemas/ColorMarker"
        image_url:
          type: string
          description: The URL to the image to be color matched.
          format: uri
          example: https://example.com/image.jpg
        callback_url:
          type: string
          description: "Optional webhook URL to receive the processing results when using
            asynchronous mode (Add header 'Respond-Mode: async'). If provided,
            the result will be sent to this URL via HTTP POST when processing
            completes. If not provided, use the job status endpoint to retrieve
            results."
          format: uri
          nullable: true
          example: https://your-domain.com/webhook/color-matching
      description: Specify an array of color markers as the input. Each color marker
        must include both x_coordinate and y_coordinate to indicate the exact
        location on the image where the marker should be applied.
    ColorMatchingResult:
      type: object
      properties:
        result_image_url:
          type: string
          description: When running in sync mode, a URL for the JPG or PNG image is
            returned. This URL is temporary and will expire after a certain
            period.
          example: https://example.com/color-matched-image.jpg
      description: Synchronous mode result.
    CreateMaskCommand:
      required:
        - image_url
      type: object
      properties:
        feather_width:
          type: number
          description: "This is an optional setting. If omitted, the feather width 
            will be automatically determined by the AI. If set to 0, no feathering 
            will be applied, resulting in very sharp edges. Other values specify 
            the number of pixels that the mask will take to transition from fully 
            opaque (255, white) to fully transparent (0, black). Higher values 
            provide softer edges."
          format: double
          nullable: true
          example: 1.5
        trimap_url:
          type: string
          description: The URL to the image to be used to control which parts of the image
            is masked. If it is not provided, it will be generated by our
            service focusing on the main product in the image.
          nullable: true
          example: https://example.com/image.jpg
        image_url:
          type: string
          description: The URL to the image to be masked.
          format: uri
          example: https://example.com/image.jpg
        callback_url:
          type: string
          description: "Optional webhook URL to receive the processing results when using
            asynchronous mode (Add header 'Respond-Mode: async'). If provided,
            the result will be sent to this URL via HTTP POST when processing
            completes. If not provided, use the job status endpoint to retrieve
            results."
          format: uri
          nullable: true
          example: https://your-domain.com/webhook/create-mask
      description: Represents a command to initiate a create mask job.
    CreateMaskResult:
      type: object
      properties:
        result_image_url:
          type: string
          description: When running in sync mode, a URL for the PNG image is returned.
            This URL is temporary and will expire after a certain period.
          example: https://example.com/trimap-image.png
      description: Synchronous mode result.
    CreateTrimapCommand:
      required:
        - image_url
      type: object
      properties:
        image_url:
          type: string
          description: The URL to the image that will have the trimap created.
          format: uri
          example: https://example.com/image.jpg
        callback_url:
          type: string
          description: "Optional webhook URL to receive the processing results when using
            asynchronous mode (Add header 'Respond-Mode: async'). If provided,
            the result will be sent to this URL via HTTP POST when processing
            completes. If not provided, use the job status endpoint to retrieve
            results."
          format: uri
          nullable: true
          example: https://your-domain.com/webhook/create-trimap
      description: Represents a command to initiate a trimap job.
    CreateTrimapResult:
      type: object
      properties:
        result_image_url:
          type: string
          description: When running in sync mode, a URL for the PNG trimap image is
            returned. This URL is temporary and will expire after a certain
            period.
          example: https://example.com/trimap-image.png
        result_trimap_vector_url:
          type: string
          description: A JSON representation of the trimap in vector format.
          example: https://example.com/trimap-vector.json
      description: Synchronous mode result.
    JobCreationData:
      type: object
      properties:
        job_id:
          type: string
          description: This unique job identifier is returned in asynchronous mode. You
            use this job_id to check the status of your job via the status
            endpoint. It helps you track and correlate your submitted job
            throughout its lifecycle.
          format: uuid
          example: 12345678-1234-1234-1234-123456789012
      description: Asynchronous mode result.
    JobResultResponse:
      type: object
      properties:
        result_image_url:
          type: string
          description: URL to the processed result image. This URL is temporary and will
            expire after a certain period. Available for all job types.
          nullable: true
          example: https://example.com/result/image.png
        result_trimap_vector_url:
          type: string
          description: URL to the trimap vector file (JSON format). Only available for
            CreateTrimap jobs. This field will be null for other job types.
          nullable: true
          example: https://example.com/result/trimap-vector.json
      description: Contains URLs to the processing results. Available only when the
        job status is Completed.
      nullable: true
    JobStatusInfoResponse:
      type: object
      properties:
        status_code:
          type: integer
          description: "Numeric status code. Common values: 100 (Processing), 200
            (Completed), 500 (Failed)."
          format: int32
          example: 200
        status_name:
          type: string
          description: Human-readable status name corresponding to the status code (e.g.,
            Processing, Completed, Failed).
          example: Completed
      description: Status information for a job.
    JobStatusResponse:
      type: object
      properties:
        job_type:
          type: string
          description: The type of processing job (e.g., RemoveBackground, CreateTrimap,
            CreateMask, ModelCrop, ColorMatching).
          example: RemoveBackground
        status:
          $ref: "#/components/schemas/JobStatusInfoResponse"
        result:
          $ref: "#/components/schemas/JobResultResponse"
      description: Represents the status and result of a processing job.
    ModelCropCommand:
      required:
        - image_url
      type: object
      properties:
        top_crop_location:
          enum:
            - eye_higher
            - below_eye
            - btw_eye_and_nose
            - below_nose
            - between_nose_and_mouth
            - below_mouth
            - below_chin
            - chest
            - at_elbow_higher
            - at_elbow_lower
            - waist
            - below_buttock
            - main_body_axis
            - mid_thigh
            - above_knee
            - at_knee
            - below_knee
          type: string
          description: "Optional. A string describing where to crop the image at the top.
            For example: 'below_eye' = Everything from below the eyes and up is
            cropped away. At least one of top_crop_location or
            bottom_crop_location must be provided."
          nullable: true
          example:
            - below_eye
        bottom_crop_location:
          enum:
            - eye_higher
            - below_eye
            - btw_eye_and_nose
            - below_nose
            - between_nose_and_mouth
            - below_mouth
            - below_chin
            - chest
            - at_elbow_higher
            - at_elbow_lower
            - waist
            - below_buttock
            - main_body_axis
            - mid_thigh
            - above_knee
            - at_knee
            - below_knee
          type: string
          description: "Optional. A string describing where to crop the image at the
            bottom. Example: 'bottom_crop_location': 'at_knee' = Everything from
            the knees and down is cropped away. At least one of
            top_crop_location or bottom_crop_location must be provided."
          nullable: true
          example:
            - at_knee
        image_url:
          type: string
          description: The URL to the image to be processed.
          format: uri
        callback_url:
          type: string
          description: "Optional webhook URL to receive the processing results when using
            asynchronous mode (Add header 'Respond-Mode: async'). If provided,
            the result will be sent to this URL via HTTP POST when processing
            completes. If not provided, use the job status endpoint to retrieve
            results."
          format: uri
          nullable: true
          example: https://your-domain.com/webhook/model-crop
      description: Represents a command to initiate a model crop job. Provide your
        image URL, at least one crop location (top or bottom), and an optional
        callback URL to receive results.
    ModelCropResult:
      type: object
      properties:
        result_image_url:
          type: string
          description: When running in sync mode, a URL for the JPG or PNG image is
            returned. This URL is temporary and will expire after a certain
            period.
          example: https://example.com/cropped_output.jpeg
      description: Synchronous mode result.
    PrepareUploadRequest:
      required:
        - fileName
      type: object
      properties:
        fileName:
          type: string
          description: "The name of the file you want to upload, including the file
            extension (e.g., 'my-product-image.jpg'). The extension determines
            how the system processes your file. Supported formats: jpg, jpeg,
            png, webp."
          example: my-image.jpg
      description: Represents a request to prepare a file upload. You provide the
        file's name (including extension) to receive a secure, temporary URL for
        uploading your asset.
    RemoveBackgroundCommand:
      required:
        - image_url
      type: object
      properties:
        trimap_url:
          type: string
          description: The URL to the image to be used to control which parts of the image
            is background removed. If it is not provided, it will be generated
            by our service focusing on the main product in the image.
          nullable: true
          example: https://example.com/image.jpg
        feather_width:
          type: number
          description: "This is an optional setting. If omitted, the feather width 
            will be automatically determined by the AI. If set to 0, no feathering 
            will be applied, resulting in very sharp edges. Other values specify 
            the number of pixels that the mask will take to transition from fully 
            opaque (255, white) to fully transparent (0, black). Higher values 
            provide softer edges."
          format: double
          nullable: true
          example: 1.5
        transparent_background:
          type: boolean
          description: If this is set to true, the background will be transparent and the
            output format will be PNG. This cannot be used together with
            background_color.
          nullable: true
          example: false
        background_color:
          type: string
          description: The hex format color code (e.g., '#FF5733') to be put as the
            background color. This cannot be used together with
            transparent_background.
          nullable: true
          example: "#FFFFFF"
        image_url:
          type: string
          description: The URL to the image to be background removed.
          format: uri
          example: https://example.com/image.jpg
        callback_url:
          type: string
          description: "Optional webhook URL to receive the processing results when using
            asynchronous mode (Add header 'Respond-Mode: async'). If provided,
            the result will be sent to this URL via HTTP POST when processing
            completes. If not provided, use the job status endpoint to retrieve
            results."
          format: uri
          nullable: true
          example: https://your-domain.com/webhook/background-removal
      description: "Represents a command for users to request background removal from
        an image, creating a new job in the automation system. Use this to
        submit your image and required options for processing.\r

        \                Note: You must choose only one of the following options
        for the output background—either 'background_color' or
        'transparent_background'. Do not set both, and do not leave both unset
        (one must be provided)."
    RemoveBackgroundResult:
      type: object
      properties:
        result_image_url:
          type: string
          description: When running in sync mode, a URL for the input image with its
            background removed is returned. This URL is temporary and will
            expire after a certain period.
          example: https://example.com/trimap-image.png
      description: Synchronous mode result.
    RequestFileUploadResult:
      required:
        - fileName
        - url
      type: object
      properties:
        fileName:
          type: string
          description: The name of the file that was prepared for upload. This helps you
            confirm which asset is being processed.
          example: my-image.jpg
        url:
          type: string
          description: The secure, pre-signed URL you should use to upload your file. This
            link is valid for a limited time and ensures your upload is safe and
            direct.
          example: https://presigned-url-for-upload.com/my-image.jpg?params=...
        expirationTime:
          type: string
          description: The time until the pre-signed URL expires. Make sure to upload your
            file before this time to avoid errors.
          format: date-time
          nullable: true
          example: 2025-01-31T12:00:00.0000000+00:00
      description: Represents the result of a file upload request, providing you with
        the necessary information to securely upload your file. This endpoint
        only operates in synchronous mode and returns the result immediately.
    SecurityKey:
      type: object
      properties:
        algorithm:
          type: string
          description: The cryptographic algorithm used to sign webhook payloads (e.g.,
            'RS256'). Use this to verify the integrity of messages from Pixelz.
          example: RS256
        encoding:
          type: string
          description: The encoding format of the public key
          example: base64
        public_key:
          type: string
          description: The public key used for verifying webhook signatures
          example: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQ...
      description: Represents a base command for creating a job in the automation system.
    SwatchImage:
      type: object
      properties:
        swatch_image_url:
          type: string
          description: The URL of the swatch image.
          format: uri
          example: https://example.com/swatch-image.jpg
        x_coordinate:
          type: integer
          description: The horizontal position (x-coordinate) of the center of a 30x30px
            block in the swatch file which is representative of the reference
            color (avoid shadows and highlights).
          example: 12
        y_coordinate:
          type: integer
          description: The vertical position (y-coordinate) of the center of a 30x30px
            block in the swatch file which is representative of the reference
            color (avoid shadows and highlights).
          example: 34
      description: The swatch image associated with this color marker. If
        *swatch_image* is not null, every element of the field must not be null.
        When swatch_image is set swatch_color_code must be null.
      nullable: true
      example:
        swatch_image_url: https://example.com/swatch-image.jpg
        x_coordinate: 12
        y_coordinate: 34
  securitySchemes:
    Bearer:
      type: http
      description: "Enter your Bearer token in the format: Bearer {your-token-here}"
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      description: "OAuth 2.0 authentication using the Client Credentials Grant
        flow.\r

        \r

        To authenticate:\r

        1. Obtain your client_id and client_secret from your Pixelz account
        dashboard\r

        2. Request an access token from the token endpoint with
        grant_type=client_credentials\r

        3. Use the returned access token in the Authorization header: 'Bearer
        {access_token}'\r

        4. Access tokens expire after 1 hour (3600 seconds) - request a new
        token when needed\r

        \r

        Available scopes:\r

        - automation.api: Access to image processing endpoints\r

        - file.api: Access to file upload functionality (requires account
        enablement)"
      flows:
        clientCredentials:
          tokenUrl: https://id.pixelz.com/realms/pixelz-automations/protocol/openid-connect/
          scopes:
            automation-api.all: AutomationApi
            automation-api.files.upload: FileApi
tags:
  - name: Image processing
  - name: File
  - name: Job Management
  - name: Webhook
