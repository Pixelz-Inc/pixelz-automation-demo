  /v1/images/jobs/{jobId}/status:
    get:
      tags:
        - Job Management
      summary: Get Job Status
      description: >-
        Retrieves the current status and result of a processing job using its
        job ID. Use this endpoint to track jobs submitted in asynchronous mode.


        **Rate Limit:** 120 requests per minute.


        **Cost:** Free (no tokens consumed).
      operationId: GetJobStatus
      parameters:
        - name: jobId
          in: path
          description: The unique identifier of the job returned when submitting an
            asynchronous request (HTTP 201 response).
          required: true
          schema:
            type: string
            format: uuid
          example: 12345678-1234-1234-1234-123456789012
      responses:
        "200":
          description: Job status retrieved successfully. The response includes the job
            type, current status, and result if the job has completed
            successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
              examples:
                CompletedJob:
                  summary: Completed job with result
                  description: Example response when a job has completed successfully. The result
                    contains the processed image URL and optional additional
                    data depending on the job type.
                  value:
                    job_type: RemoveBackground
                    status:
                      status_code: 4
                      status_name: Completed
                    result:
                      result_image_url: https://example.com/result/image-background-removed.png
                      result_trimap_vector_url: null
                ProcessingJob:
                  summary: Job in progress
                  description: Example response when a job is still being processed. The result
                    field will be null until processing completes.
                  value:
                    job_type: ModelCrop
                    status:
                      status_code: 3
                      status_name: Processing
                    result: null
                FailedJob:
                  summary: Failed job
                  description: Example response when a job has failed during processing. The
                    result field will be null.
                  value:
                    job_type: CreateTrimap
                    status:
                      status_code: 6
                      status_name: Failed
                    result: null
                CompletedTrimapJob:
                  summary: Completed trimap job with vector result
                  description: Example response for a completed trimap creation job. This job type
                    returns both the image result and a trimap vector URL.
                  value:
                    job_type: CreateTrimap
                    status:
                      status_code: 4
                      status_name: Completed
                    result:
                      result_image_url: https://example.com/result/trimap-image.png
                      result_trimap_vector_url: https://example.com/result/trimap-vector.json
        "401":
          description: Missing or invalid authentication token. Ensure the Authorization
            header contains a valid Bearer token.
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "404":
          description: Job not found or does not belong to the authenticated client.
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/images/model-crop:
    post:
      tags:
        - Image processing
      summary: Model Crop
      description: |-
        Crop a model image at predefined body reference points.

        **Rate Limit:** 60 requests per minute.

        **Cost:** 10 tokens per request.
      operationId: ModelCropJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCropCommand"
            examples:
              CropTopAndBottom:
                summary: Crop both top and bottom
                description: Use this example to crop both the top and bottom of a model image.
                  This is useful for creating consistent framing across multiple
                  product shots.
                value:
                  image_url: https://example.com/model-image.jpg
                  top_crop_location: below_eye
                  bottom_crop_location: at_knee
              CropTopOnly:
                summary: Crop top only
                description: Use this example to crop only the top portion of the image while
                  keeping the full length from the crop point down.
                value:
                  image_url: https://example.com/model-image.jpg
                  top_crop_location: below_chin
                  bottom_crop_location: null
              CropBottomOnly:
                summary: Crop bottom only
                description: Use this example to crop only the bottom portion of the image while
                  keeping the full length from top to the crop point.
                value:
                  image_url: https://example.com/model-image.jpg
                  top_crop_location: null
                  bottom_crop_location: below_knee
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/model-image.jpg
                  top_crop_location: below_eye
                  bottom_crop_location: at_knee
                  callback_url: https://your-domain.com/webhook/model-crop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCropResult"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreationData"
        "400":
          description: Bad Request
        "401":
          description: UnauthorizedError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 401
        "403":
          description: ForbiddenError
          headers:
            StatusCode:
              description: HTTP status code
              schema:
                type: integer
                format: int32
                example: 403
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    format: int32
                    example: 500
                  title:
                    type: string
                    description: Internal Server Error
                    example: InternalServerError
                  detail:
                    type: string
                    description: Detailed error message
                    example: Internal Server Error
                description: Internal Server Error
                example:
                  status: 500
                  title: InternalServerError
                  detail: Internal Server Error
  /v1/images/remove-background:
    post:
      tags:
        - Image processing
      summary: Remove Background
      description: |-
        Removes the background from an image.

        **Rate Limit:** 30 requests per minute.

        **Cost:** 100 tokens per request.
      operationId: RemoveBackgroundJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveBackgroundCommand"
            examples:
              WithTransparentBackground:
                summary: Remove background with transparency
                description: Use this example to remove the background and make it transparent.
                  The output will be a PNG image. The background_color must be
                  null.
                value:
                  image_url: https://example.com/product-image.jpg
                  transparent_background: true
                  background_color: null
                  feather_width: 1.5
              WithBackgroundColor:
                summary: Remove background with solid color
                description: Use this example to remove the background and replace it with a
                  solid color. Specify the color in hex format. The
                  transparent_background must be false or null.
                value:
                  image_url: https://example.com/product-image.jpg
                  background_color: "#FFFFFF"
                  transparent_background: false
                  feather_width: 2
              WithCustomTrimap:
                summary: Remove background with custom trimap
                description: Use this example when you have a custom trimap image to control
                  which parts of the image should be kept as foreground. This
                  gives you precise control over the background removal process.
                value:
                  image_url: https://example.com/product-image.jpg
                  trimap_url: https://example.com/custom-trimap.png
                  transparent_background: true
                  background_color: null
                  feather_width: 1.5
              WithAsyncCallback:
                summary: Asynchronous processing with webhook callback
                description: Use this example to process the image asynchronously. Set the
                  Respond-Mode header to 'async'. Optionally include a
                  callback_url to receive the results via webhook when
                  processing completes, or use the job status endpoint to
                  retrieve results. You will receive a job_id in the response
                  (HTTP 201).
                value:
                  image_url: https://example.com/product-image.jpg
                  transparent_background: true
                  background_color: null
                  feather_width: 1.5
                  callback_url: https://your-domain.com/webhook/remove-background
      responses:
        "200":
          description: OK
          content:
            application/json:
